services:
  postgres:
    image: postgres:16
    container_name: redis-lab-postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: shop
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis-lab-redis
    ports:
      - "6380:6379"

volumes:
  postgres_data:
